name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pycryptodome aiohttp voluptuous

      - name: Lint
        run: |
          pip install ruff
          ruff check custom_components/ examples/ tools/ --ignore E501

      - name: Test
        run: PYTHONPATH=. pytest -v --tb=short tests/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the point is to catch a secret that was committed
          # and then deleted, which a shallow clone would not see.
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.0 \
            detect --source=. --config=.gitleaks.toml --redact --no-banner

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Check formatting
        working-directory: avent-webrtc-bridge
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            echo "Run: docker run --rm -v \$PWD:/src -w /src golang:1.26-bookworm gofmt -w ."
            exit 1
          fi

      - name: Build bridge
        working-directory: avent-webrtc-bridge
        run: go build -o avent-webrtc-bridge .

      - name: Test
        working-directory: avent-webrtc-bridge
        run: go test ./...

      - name: Verify binary
        working-directory: avent-webrtc-bridge
        run: ./avent-webrtc-bridge --help

  docker-addon:
    runs-on: ubuntu-latest
    needs: [test-python, test-go]
    steps:
      - uses: actions/checkout@v7

      - name: Copy bridge source for Docker build
        run: cp -r avent-webrtc-bridge aventproxy-bridge-addon/avent-webrtc-bridge

      - name: Build add-on Docker image
        run: |
          docker build \
            --build-arg BUILD_FROM=debian:bookworm-slim \
            -t aventproxy-bridge:test \
            aventproxy-bridge-addon/

      - name: Verify binary in container
        run: |
          docker run --rm aventproxy-bridge:test avent-webrtc-bridge --help

  test-lan-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Prepare isolated LAN dependencies
        run: pip install --target tests/.runtime-deps --no-deps tinytuya==1.20.0
      - name: Test real HA runtime without network access
        run: |
          mkdir -p deps
          docker run --rm --network none --user 1000:1000 --cap-drop ALL \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -v "$PWD:/src:ro" -v "$PWD/tests/.runtime-deps:/src/deps:ro" \
            --entrypoint python ghcr.io/home-assistant/home-assistant:2026.10.1 \
            /src/tests/runtime_lan_only.py

  docker-lan-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test App runtime and process cleanup
        run: python3 -m unittest discover -s aventproxy-lan-addon -p 'test_*.py' -v
      - name: Lint LAN App
        run: |
          pip install ruff
          ruff check aventproxy-lan-addon/ --ignore E501
      - name: Build LAN App from pinned source
        run: docker build --build-arg BUILD_ARCH=amd64 -t avent-lan-bridge:test aventproxy-lan-addon/
      - name: Verify camera client binary
        run: docker run --rm --network none --entrypoint babymonitor-cli avent-lan-bridge:test --help
      - name: Verify App starts without provisioning or network access
        run: |
          docker run -d --name avent-lan-smoke --network none avent-lan-bridge:test
          trap 'docker logs avent-lan-smoke; docker rm -f avent-lan-smoke' EXIT
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' avent-lan-smoke)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1
